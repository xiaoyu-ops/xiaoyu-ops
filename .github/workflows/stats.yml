name: WakaTime & GitHub Stats Update

on:
  schedule:
    # 自动执行：设置为每 4 小时运行一次
    - cron: '0 */4 * * *'
  workflow_dispatch: # 允许你手动点击 "Run" 按钮来触发

jobs:
  update-readme:
    name: Update Profile README
    runs-on: ubuntu-latest
    steps:
      - uses: anmol098/waka-readme-stats@master
        with:
          # 必需项
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

          # --- GitHub 统计 ---
          # (对应 "My GitHub Data" 部分)
          SHOW_CONTRIBUTIONS: "true"      # 显示 "Contributions in the Year"
          SHOW_REPOS: "true"              # 显示 "Public/Private Repositories"
          SHOW_HIREABLE: "true"           # 显示 "Opted to Hire" (如果你在主页设置了 "Available for hire")
          SHOW_STORAGE: "true"            # 显示 "Used in GitHub's Storage"

          # --- WakaTime 统计 ---
          # (对应 "This Week I Spent My Time On" 部分)
          SHOW_PROJECTS: "true"           # 显示 "Projects"
          SHOW_EDITORS: "true"            # 显示 "Editors"
          SHOW_OS: "true"                 # 显示 "Operating System"
          SHOW_TIMEZONE: "true"           # 显示 "Time Zone"
          SHOW_LANGUAGES: "true"          # 显示 "Programming Languages"
          SHOW_LANGUAGE_PER_REPO: "true"  # 显示 "I Mostly Code in..."

          # --- 徽章 ---
          SHOW_TOTAL_CODE_TIME: "true"    # 显示 "Code Time" 徽章
          SHOW_PROFILE_VIEWS: "true"      # 显示 "Profile Views" 徽章

          # --- 选项 ---
          TIMEZONE: "Asia/Shanghai"       # 设置时区为 "Asia/Shanghai" (和示例图一致)
          LANG_COUNT: "5"                 # 只显示前 5 门语言 (和示例图一致)
          SECTION_NAME: "waka"            # 必须和 3.2 步的 "START_SECTION:waka" 对应
          COMMIT_MESSAGE: "Update README stats" # 自动提交时的消息
